    <script>
        /**
         * ====================================================================
         * 1. DATABASE SYSTEM (IndexedDB + LocalStorage)
         * ====================================================================
         */
        class DatabaseSystem {
            constructor() {
                this.dbName = 'AISavingSystemDB_v2';
                this.dbVersion = 1;
                this.db = null;
            }

            async init() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(this.dbName, this.dbVersion);

                    request.onupgradeneeded = (event) => {
                        const db = event.target.result;
                        // Income Table
                        if (!db.objectStoreNames.contains('incomes')) {
                            const incomeStore = db.createObjectStore('incomes', { keyPath: 'id' });
                            incomeStore.createIndex('date', 'date', { unique: false });
                        }
                        // Expense Table
                        if (!db.objectStoreNames.contains('expenses')) {
                            const expenseStore = db.createObjectStore('expenses', { keyPath: 'id' });
                            expenseStore.createIndex('date', 'date', { unique: false });
                        }
                        // Savings Table
                        if (!db.objectStoreNames.contains('savings')) {
                            const savingsStore = db.createObjectStore('savings', { keyPath: 'id' });
                            savingsStore.createIndex('date', 'date', { unique: false });
                        }
                        // Goals Table
                        if (!db.objectStoreNames.contains('goals')) {
                            const goalStore = db.createObjectStore('goals', { keyPath: 'id' });
                        }
                        // Notifications Log
                        if (!db.objectStoreNames.contains('notifications')) {
                            const notifStore = db.createObjectStore('notifications', { keyPath: 'id' });
                        }
                    };

                    request.onsuccess = (event) => {
                        this.db = event.target.result;
                        resolve(this);
                    };

                    request.onerror = (event) => {
                        console.error("IndexedDB Error:", event.target.error);
                        reject(event.target.error);
                    };
                });
            }

            // Generic CRUD Operations
            async getAll(storeName) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(storeName, 'readonly');
                    const store = tx.objectStore(storeName);
                    const request = store.getAll();
                    request.onsuccess = () => resolve(request.result || []);
                    request.onerror = () => reject(request.error);
                });
            }

            async add(storeName, item) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(storeName, 'readwrite');
                    const store = tx.objectStore(storeName);
                    const request = store.add(item);
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            }

            async update(storeName, item) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(storeName, 'readwrite');
                    const store = tx.objectStore(storeName);
                    const request = store.put(item);
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            }

            async delete(storeName, id) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(storeName, 'readwrite');
                    const store = tx.objectStore(storeName);
                    const request = store.delete(id);
                    request.onsuccess = () => resolve(true);
                    request.onerror = () => reject(request.error);
                });
            }

            async clearStore(storeName) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(storeName, 'readwrite');
                    const store = tx.objectStore(storeName);
                    const request = store.clear();
                    request.onsuccess = () => resolve(true);
                    request.onerror = () => reject(request.error);
                });
            }

            // LocalStorage Helpers for Settings
            getSetting(key, defaultValue = null) {
                const val = localStorage.getItem(`ai_saving_setting_${key}`);
                return val !== null ? JSON.parse(val) : defaultValue;
            }

            setSetting(key, value) {
                localStorage.setItem(`ai_saving_setting_${key}`, JSON.stringify(value));
            }
        }

        const db = new DatabaseSystem();

        /**
         * ====================================================================
         * 2. INTERNAL API SYSTEM (All in-memory calculation & local processing)
         * ====================================================================
         */
        class InternalAPISystem {
            // Income API
            static async getIncomes() { return await db.getAll('incomes'); }
            static async addIncome(income) {
                income.id = income.id || 'inc_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
                income.createdAt = new Date().toISOString();
                await db.add('incomes', income);
                return income;
            }
            static async deleteIncome(id) { return await db.delete('incomes', id); }

            // Expense API
            static async getExpenses() { return await db.getAll('expenses'); }
            static async addExpense(expense) {
                expense.id = expense.id || 'exp_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
                expense.createdAt = new Date().toISOString();
                await db.add('expenses', expense);
                return expense;
            }
            static async deleteExpense(id) { return await db.delete('expenses', id); }

            // Savings API
            static async getSavings() { return await db.getAll('savings'); }
            static async addSavings(savings) {
                savings.id = savings.id || 'sav_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
                savings.createdAt = new Date().toISOString();
                await db.add('savings', savings);
                return savings;
            }
            static async deleteSavings(id) { return await db.delete('savings', id); }

            // Goal API (Goal funds tracked separately from main savings as per prompt)
            static async getGoals() { return await db.getAll('goals'); }
            static async addGoal(goal) {
                goal.id = goal.id || 'goal_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
                goal.savedAmount = goal.savedAmount || 0;
                goal.createdAt = new Date().toISOString();
                await db.add('goals', goal);
                return goal;
            }
            static async updateGoal(goal) { return await db.update('goals', goal); }
            static async deleteGoal(id) { return await db.delete('goals', id); }

            // Notifications API
            static async getNotifications() { return await db.getAll('notifications'); }
            static async addNotification(notif) {
                notif.id = 'notif_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
                notif.date = new Date().toISOString();
                notif.read = false;
                await db.add('notifications', notif);
            }

            // Balance API & Calculation API
            static async getFinancialSummary() {
                const incomes = await this.getIncomes();
                const expenses = await this.getExpenses();
                const savings = await this.getSavings();

                const totalIncome = incomes.reduce((sum, item) => sum + Number(item.amount || 0), 0);
                const totalExpense = expenses.reduce((sum, item) => sum + Number(item.amount || 0), 0);
                const totalSavings = savings.reduce((sum, item) => sum + Number(item.amount || 0), 0);

                // Balance = Income - Expense - Total Savings
                const remainingBalance = totalIncome - totalExpense - totalSavings;
                const savingsRate = totalIncome > 0 ? ((totalSavings / totalIncome) * 100).toFixed(1) : 0;

                // Daily Average Calculation
                const daysInSystem = Math.max(1, Math.ceil((new Date() - new Date(db.getSetting('init_date', Date.now()))) / (1000 * 60 * 60 * 24)));
                const avgDailySaving = totalSavings / daysInSystem;

                return {
                    totalIncome,
                    totalExpense,
                    totalSavings,
                    remainingBalance,
                    savingsRate: parseFloat(savingsRate),
                    avgDailySaving,
                    daysInSystem
                };
            }

            // Analytics API & Prediction API
            static async getAnalyticsData() {
                const summary = await this.getFinancialSummary();
                const incomes = await this.getIncomes();
                const expenses = await this.getExpenses();
                const savings = await this.getSavings();

                // Group by Category
                const expenseCategories = {};
                expenses.forEach(e => {
                    expenseCategories[e.category] = (expenseCategories[e.category] || 0) + Number(e.amount);
                });

                // Prediction calculations (Rule-based Linear Projection)
                const monthlyAvgSavings = summary.avgDailySaving * 30;
                const yearlyAvgSavings = summary.avgDailySaving * 365;

                const next3Months = summary.totalSavings + (monthlyAvgSavings * 3);
                const next6Months = summary.totalSavings + (monthlyAvgSavings * 6);
                const next12Months = summary.totalSavings + (yearlyAvgSavings);

                return {
                    summary,
                    expenseCategories,
                    monthlyAvgSavings,
                    yearlyAvgSavings,
                    predictions: {
                        month3: next3Months,
                        month6: next6Months,
                        month12: next12Months
                    }
                };
            }

            // Saving Level API (5 Levels Evaluation)
            static async calculateSavingLevel() {
                const summary = await this.getFinancialSummary();
                const savings = await this.getSavings();
                
                const count = savings.length;
                const rate = summary.savingsRate;
                const total = summary.totalSavings;

                let level = 1;
                let title = "Novice Saver (ผู้เริ่มต้นออม)";
                let desc = "เริ่มต้นสร้างวินัยทางการเงิน บันทึกข้อมูลอย่างสม่ำเสมอ";
                let icon = "fa-seedling";
                let color = "text-emerald-400";
                let nextRequirement = "ออมเงินให้ได้อย่างน้อย 1,000 บาท และมีรายการออม 3 ครั้งขึ้นไป";
                let progress = 0;

                if (total >= 50000 && rate >= 30 && count >= 20) {
                    level = 5;
                    title = "Wealth Master (ปรมาจารย์ทางการเงิน)";
                    desc = "มีความมั่นคงทางการเงินสูง อัตราการออมยอดเยี่ยมและสม่ำเสมอ";
                    icon = "fa-crown";
                    color = "text-amber-400";
                    nextRequirement = "คุณถึงระดับสูงสุดแล้ว! รักษาพฤติกรรมนี้ไว้";
                    progress = 100;
                } else if (total >= 25000 && rate >= 20 && count >= 15) {
                    level = 4;
                    title = "Expert Saver (นักออมผู้เชี่ยวชาญ)";
                    desc = "บริหารเงินออมได้เป็นอย่างดี ปรับแผนชีวิตได้อย่างสมดุล";
                    icon = "fa-gem";
                    color = "text-cyan-400";
                    nextRequirement = "ออมสะสมถึง 50,000 บาท + อัตราออม >30% + บันทึก >20 ครั้ง";
                    progress = Math.min(99, Math.round((total / 50000) * 100));
                } else if (total >= 10000 && rate >= 15 && count >= 10) {
                    level = 3;
                    title = "Smart Saver (นักออมฉลาดเลือก)";
                    desc = "มีเป้าหมายที่ชัดเจนและวินัยการออมระดับปานกลาง";
                    icon = "fa-shield-halved";
                    color = "text-blue-400";
                    nextRequirement = "ออมสะสมถึง 25,000 บาท + อัตราออม >20% + บันทึก >15 ครั้ง";
                    progress = Math.min(99, Math.round((total / 25000) * 100));
                } else if (total >= 1000 && count >= 3) {
                    level = 2;
                    title = "Active Saver (นักออมมือโปร)";
                    desc = "เริ่มเห็นความก้าวหน้าของการออม มีแนวโน้มพฤติกรรมที่ดี";
                    icon = "fa-chart-line";
                    color = "text-indigo-400";
                    nextRequirement = "ออมสะสมถึง 10,000 บาท + อัตราออม >15% + บันทึก >10 ครั้ง";
                    progress = Math.min(99, Math.round((total / 10000) * 100));
                } else {
                    progress = Math.min(99, Math.round((total / 1000) * 100));
                }

                return { level, title, desc, icon, color, nextRequirement, progress };
            }
        }

        /**
         * ====================================================================
         * 3. AI AUTOMATIC ENGINE (Rule-Based & Statistical Engine)
         * ====================================================================
         */
        class AIFinancialEngine {
            static async generateInsights() {
                const analytics = await InternalAPISystem.getAnalyticsData();
                const expenses = await InternalAPISystem.getExpenses();
                const summary = analytics.summary;
                const insights = [];

                // 1. Savings Rate Analysis
                if (summary.totalIncome === 0) {
                    insights.push({
                        type: 'warning',
                        title: 'ยังไม่มีข้อมูลรายรับ',
                        message: 'กรุณาบันทึกรายรับเพื่อให้ระบบ AI สามารถคำนวณและประเมินอัตราการออมของคุณได้',
                        action: 'บันทึกรายรับ'
                    });
                } else if (summary.savingsRate < 10) {
                    insights.push({
                        type: 'danger',
                        title: 'อัตราการออมต่ำกว่าเกณฑ์มาตรฐาน (ต่ำกว่า 10%)',
                        message: `ปัจจุบันอัตราการออมอยู่ที่ ${summary.savingsRate}% แนะนำให้ปรับลดค่าใช้จ่ายไม่จำเป็นเพื่อเพิ่มเงินออมฉุกเฉิน`,
                        action: 'ปรับแผนการออม'
                    });
                } else if (summary.savingsRate >= 20) {
                    insights.push({
                        type: 'success',
                        title: 'สุขภาพการออมอยู่ในเกณฑ์ยอดเยี่ยม!',
                        message: `คุณสามารถออมเงินได้สูงถึง ${summary.savingsRate}% ของรายรับ ซึ่งเกินเกณฑ์มาตรฐาน 20% แล้ว`,
                        action: 'ตั้งเป้าหมายใหม่'
                    });
                }

                // 2. Expense Spikes Detection
                const catTotals = analytics.expenseCategories;
                let highestCat = '';
                let highestAmt = 0;
                for (const [cat, amt] of Object.entries(catTotals)) {
                    if (amt > highestAmt) {
                        highestAmt = amt;
                        highestCat = cat;
                    }
                }

                if (highestAmt > 0 && summary.totalExpense > 0) {
                    const pct = ((highestAmt / summary.totalExpense) * 100).toFixed(0);
                    if (pct >= 40) {
                        insights.push({
                            type: 'warning',
                            title: `ตรวจพบการใช้จ่ายกระจุกตัวในหมวด "${highestCat}"`,
                            message: `หมวดหมู่นี้คิดเป็น ${pct}% ของค่าใช้จ่ายทั้งหมด (${highestAmt.toLocaleString()} บาท) แนะนำให้ทบทวนความจำเป็น`,
                            action: 'ดูสถิติการใช้จ่าย'
                        });
                    }
                }

                // 3. Balance Capacity Assessment
                if (summary.remainingBalance < 0) {
                    insights.push({
                        type: 'danger',
                        title: 'เตือนภัย: ดุลการเงินติดลบ!',
                        message: 'รายจ่ายรวมและเงินออมของคุณสูงกว่ารายรับที่มี กรุณาตรวจสอบและปรับปรุงด่วน',
                        action: 'จัดการรายจ่าย'
                    });
                }

                // 4. Future Saving Opportunity
                if (summary.avgDailySaving > 0) {

                const needs = income * 0.50; // สิ่งจำเป็น 50%

                    recommendedSavings: savingsTarget,
                    currentSavings: summary.totalSavings,

            static showToast(message, type = 'info') {
                const container = document.getElementById('toast-container');
                const toast = document.createElement('div');
                
                let bg = 'bg-slate-800 text-white border-slate-700';
                let icon = 'fa-circle-info text-blue-400';

                if (type === 'success') {
                    bg = 'bg-emerald-950/90 text-emerald-100 border-emerald-800';
                    icon = 'fa-circle-check text-emerald-400';
                } else if (type === 'danger') {
                    bg = 'bg-rose-950/90 text-rose-100 border-rose-800';
                    icon = 'fa-triangle-exclamation text-rose-400';
                }

                toast.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl border ${bg} shadow-xl backdrop-blur-md transition-all transform translate-y-2 opacity-0 duration-200 text-sm`;
                toast.innerHTML = `<i class="fa-solid ${icon} text-lg"></i><span>${message}</span>`;
                
                container.appendChild(toast);
                setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);

                setTimeout(() => {
                    toast.classList.add('opacity-0', '-translate-y-2');
                    setTimeout(() => toast.remove(), 300);

            static async handleSaveGoal(e) {
                e.preventDefault();
                const name = document.getElementById('goal-name').value.trim();
                const targetAmount = parseFloat(document.getElementById('goal-target').value);
                const deadline = document.getElementById('goal-deadline').value;

                if (!name || isNaN(targetAmount)) return;

                await InternalAPISystem.addGoal({ name, targetAmount, savedAmount: 0, deadline });
                this.closeModal();
                this.showToast('สร้างเป้าหมายใหม่สำเร็จ', 'success');
                this.navigateTo('goals');
            }

            static async showDepositGoalModal(goalId) {
                const goals = await InternalAPISystem.getGoals();
                const goal = goals.find(g => g.id === goalId);
                if (!goal) return;

                const html = `
                    <form onsubmit="UIController.handleDepositGoal(event, '${goal.id}')" class="space-y-4">

            static async handleDepositGoal(e, goalId) {
                e.preventDefault();
                const amt = parseFloat(document.getElementById('goal-deposit-amt').value);
                if (isNaN(amt) || amt <= 0) return;

                const goals = await InternalAPISystem.getGoals();
                const goal = goals.find(g => g.id === goalId);
                if (goal) {
                    goal.savedAmount = Number(goal.savedAmount || 0) + amt;
                    await InternalAPISystem.updateGoal(goal);
                    this.closeModal();
                    this.showToast('เติมเงินใส่เป้าหมายเรียบร้อยแล้ว', 'success');
                    this.navigateTo('goals');
                }
            }

                                <h4 class="font-bold text-sm text-slate-800 dark:text-slate-100">กู้คืนข้อมูล (Restore Data)</h4>
                                <p class="text-xs text-slate-400">นำเข้าไฟล์ JSON เพื่อนำข้อมูลกลับคืนมาสู่ระบบ</p>
                                <input type="file" id="import-file" accept=".json" class="hidden" onchange="UIController.handleImportData(event)">
                                <button onclick="document.getElementById('import-file').click()" class="w-full py-2.5 rounded-xl bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-100 font-semibold text-xs transition-all">
                                    <i class="fa-solid fa-upload mr-1"></i> เลือกไฟล์กู้คืนข้อมูล
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }

            static async handleExportData() {
                const incomes = await InternalAPISystem.getIncomes();
                const expenses = await InternalAPISystem.getExpenses();
                const savings = await InternalAPISystem.getSavings();
                const goals = await InternalAPISystem.getGoals();

                const exportObject = {
                    version: "2.0",
                    exportedAt: new Date().toISOString(),
                    data: { incomes, expenses, savings, goals }
                };

                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportObject, null, 2));
                const dlAnchorElem = document.createElement('a');
                dlAnchorElem.setAttribute("href", dataStr);
                dlAnchorElem.setAttribute("download", `AI_Saving_Backup_${new Date().toISOString().split('T')[0]}.json`);
                dlAnchorElem.click();
                this.showToast('ส่งออกข้อมูลสำเร็จแล้ว', 'success');
            }

            static async handleImportData(e) {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = async (event) => {
                    try {
                        const imported = JSON.parse(event.target.result);
                        if (imported.data) {
                            if (imported.data.incomes) for (let item of imported.data.incomes) await db.add('incomes', item);
                            if (imported.data.expenses) for (let item of imported.data.expenses) await db.add('expenses', item);
                            if (imported.data.savings) for (let item of imported.data.savings) await db.add('savings', item);
                            if (imported.data.goals) for (let item of imported.data.goals) await db.add('goals', item);

                            this.showToast('กู้คืนข้อมูลสำเร็จ!', 'success');
                            this.navigateTo('dashboard');
                        }
                    } catch (err) {
                        this.showToast('รูปแบบไฟล์ไม่ถูกต้อง', 'danger');
                    }
                };
                reader.readAsText(file);
            }

            // Page 15: Settings View
            static async renderSettingsView(container) {
                container.innerHTML = `
                    <div class="glass-card p-6 rounded-2xl space-y-6 max-w-xl">
                        <h3 class="font-bold text-lg text-slate-800 dark:text-slate-100 flex items-center gap-2">
                            <i class="fa-solid fa-gear text-brand-500"></i> ตั้งค่าระบบ
                        </h3>

                        <div class="space-y-4">
                            <div class="flex items-center justify-between py-2 border-b border-slate-200 dark:border-slate-800">
                                <div>
                                    <h4 class="font-semibold text-sm text-slate-800 dark:text-slate-100">Dark Mode / Light Mode</h4>
                                    <p class="text-xs text-slate-400">สลับธีมการแสดงผลของแอป</p>
                                </div>
                                <button onclick="document.getElementById('theme-toggle-desktop').click()" class="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-semibold">
                                    สลับธีม
                                </button>
                            </div>

                            <div class="flex items-center justify-between py-2 border-b border-slate-200 dark:border-slate-800">
                                <div>
                                    <h4 class="font-semibold text-sm text-rose-500">รีเซ็ตข้อมูลทั้งหมดในระบบ</h4>
                                    <p class="text-xs text-slate-400">ลบข้อมูลรายรับ รายจ่าย เงินออม ทั้งหมด</p>
                                </div>
                                <button onclick="UIController.handleResetAllData()" class="px-3 py-1.5 rounded-xl bg-rose-500 text-white text-xs font-semibold hover:bg-rose-600 transition-all">
                                    ลบข้อมูลทั้งหมด
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }

            static async handleResetAllData() {
                if (confirm('คุณแน่ใจหรือไม่ว่าต้องการลบข้อมูลทั้งหมดในเครื่อง? การกระทำนี้ไม่สามารถย้อนกลับได้')) {
                    await db.clearStore('incomes');
                    await db.clearStore('expenses');
                    await db.clearStore('savings');
                    await db.clearStore('goals');
                    this.showToast('ล้างข้อมูลเรียบร้อยแล้ว', 'info');
                    this.navigateTo('dashboard');
                }
            }
        }

        // Initialize App on DOM Loaded
        window.addEventListener('DOMContentLoaded', async () => {
            await db.init();
            if (!db.getSetting('init_date')) {
                db.setSetting('init_date', Date.now());
            }
            UIController.init();
        });
    </script>
</body>
</html>
